# Deploys the CRM's Supabase Edge Functions when their code changes on main,
# so server-side fixes (like the Meta ad sync) go live without anyone running
# the Supabase CLI by hand.
#
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions
# -> New repository secret, named SUPABASE_ACCESS_TOKEN, holding a token from
# https://supabase.com/dashboard/account/tokens. Until it's added this
# workflow just reports that it was skipped.
#
# It also creates the tables those functions use (see "Set up the tables").
#
# Only the functions listed below are deployed. Both check the caller
# themselves (signed-in allowlisted user, or the cron secret), so they're
# deployed with --no-verify-jwt; the scheduled sync calls in with the
# publishable key, which isn't a JWT.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sync-client-ads/**"
      - "supabase/functions/ghl-report-data/**"
      - "supabase/functions/jarvis/**"
      - "supabase/functions/send-scheduled-emails/**"
      - "supabase/functions/sync-client-inbox/**"
      - "supabase/functions/sync-ghl-leads/**"
      - "supabase/functions/precall-meetings/**"
      - "supabase/functions/_shared/**"
      - "sql/056_ghl_connections.sql"
      - "sql/057_nurture_and_jarvis.sql"
      - "sql/058_client_industry.sql"
      - "sql/059_deal_date.sql"
      - "sql/060_team_and_defaults.sql"
      - "sql/061_deal_source.sql"
      - "sql/062_scheduled_emails.sql"
      - "sql/063_margin_and_video.sql"
      - "sql/064_deal_stage_history.sql"
      - "sql/065_deal_attended.sql"
      - "sql/066_security_hardening.sql"
      - "sql/067_lost_reason_adhoc.sql"
      - "sql/068_meeting_demo_step.sql"
      - "sql/071_remove_lock_in_step.sql"
      - "sql/070_sit_rate_wording.sql"
      - "sql/072_sit_rate_invite_step.sql"
      - "sql/073_meeting_pitch_rebuild.sql"
      - "sql/074_client_inbox.sql"
      - "sql/075_inbox_by_gmail_script.sql"
      - "sql/076_payment_reminders.sql"
      - "sql/077_employees.sql"
      - "sql/078_lead_follow_up.sql"
      - "sql/079_lead_details_and_sync.sql"
      - "sql/080_lead_ad_info.sql"
      - "sql/081_lead_ghl_outcomes.sql"
      - "sql/082_precall_meetings.sql"
      - "sql/083_precall_reschedule_and_watch.sql"
      - "sql/084_employee_responsibilities.sql"
      - "sql/085_precall_ghl_sync.sql"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email to this address once everything's deployed (leave blank to skip)"
        required: false
        default: ""
      create_login:
        description: "Give this email address a CRM login: adds them to the team and emails them a link to set their password (leave blank to skip)"
        required: false
        default: ""
      check_lead_sync:
        description: "Type yes to run the lead sync now and print how many clients are connected (counts only, no names)"
        required: false
        default: ""
      check_calendar:
        description: "Check the CRM can reach this person's Google Calendar for meeting invites (an @mrpriceless.com email; leave blank to skip)"
        required: false
        default: ""
      setup_ghl:
        description: "Type yes to create the pre-call custom fields in our GHL sub-account (if missing) and list what's there"
        required: false
        default: ""
      check_meetings:
        description: "Type yes to print how booked meetings are doing: live updates, the 5-minute calendar check, alert emails (counts and statuses only, no names)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GHL_PRECALL_TOKEN: ${{ secrets.GHL_PRECALL_TOKEN }}
      GHL_PRECALL_LOCATION_ID: ${{ secrets.GHL_PRECALL_LOCATION_ID }}
      PROJECT_REF: chaexdenosljtdwuyjnw
    steps:
      - name: Check for the Supabase token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN isn't set, so the functions weren't deployed. See the note at the top of this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      # Tables the functions need, created through the Supabase API with the same
      # token, so nobody has to paste SQL into the dashboard. Safe to re-run.
      - name: Set up the tables the functions use
        if: steps.token.outputs.ok == 'true'
        run: |
          for f in sql/056_ghl_connections.sql sql/057_nurture_and_jarvis.sql sql/058_client_industry.sql sql/059_deal_date.sql sql/060_team_and_defaults.sql sql/061_deal_source.sql sql/062_scheduled_emails.sql sql/063_margin_and_video.sql sql/064_deal_stage_history.sql sql/065_deal_attended.sql sql/066_security_hardening.sql sql/067_lost_reason_adhoc.sql sql/068_meeting_demo_step.sql sql/070_sit_rate_wording.sql sql/071_remove_lock_in_step.sql sql/072_sit_rate_invite_step.sql sql/073_meeting_pitch_rebuild.sql sql/074_client_inbox.sql sql/075_inbox_by_gmail_script.sql sql/076_payment_reminders.sql sql/077_employees.sql sql/078_lead_follow_up.sql sql/079_lead_details_and_sync.sql sql/080_lead_ad_info.sql sql/081_lead_ghl_outcomes.sql sql/082_precall_meetings.sql sql/083_precall_reschedule_and_watch.sql sql/084_employee_responsibilities.sql sql/085_precall_ghl_sync.sql; do
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/q.json
            echo " <- $f"
          done
      # Sign-in lock-down: nobody can create their own account (teammates are
      # invited from the Team page, which creates the account for them), and an
      # email address has to be confirmed before it counts. Only those two
      # settings are printed - the rest of the auth config stays out of the log.
      - name: Lock down sign-ups
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data '{"disable_signup": true, "mailer_autoconfirm": false, "password_min_length": 8}' \
            | jq '{disable_signup, mailer_autoconfirm, password_min_length}'
      # Jarvis's Claude API key: add it once as the ANTHROPIC_API_KEY repo
      # secret and this copies it into the Supabase project's function secrets.
      - name: Pass Jarvis his API key
        if: steps.token.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
      # Jarvis runs free on Google Gemini: add a key from aistudio.google.com
      # once as the GEMINI_API_KEY repo secret (it wins over the Claude key).
      - name: Pass Jarvis his Gemini key
        if: steps.token.outputs.ok == 'true' && env.GEMINI_API_KEY != ''
        run: supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF"
      # Emails that send themselves (receipts): add RESEND_API_KEY (resend.com)
      # and EMAIL_FROM (e.g. Mr Priceless <accounts@mrpriceless.com>) as repo
      # secrets; EMAIL_REPLY_TO is optional.
      - name: Pass the email sender its keys
        if: steps.token.outputs.ok == 'true' && env.RESEND_API_KEY != ''
        run: |
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$PROJECT_REF"
          if [ -n "$EMAIL_FROM" ]; then supabase secrets set EMAIL_FROM="$EMAIL_FROM" --project-ref "$PROJECT_REF"; fi
          if [ -n "$EMAIL_REPLY_TO" ]; then supabase secrets set EMAIL_REPLY_TO="$EMAIL_REPLY_TO" --project-ref "$PROJECT_REF"; fi
      # Meeting invites on the closer's Google Calendar: the service account key
      # file from Google Cloud, pasted whole as the GOOGLE_SERVICE_ACCOUNT_JSON
      # repo secret. It's passed on base64-encoded (so nothing in it gets
      # mangled on the way) and never printed.
      - name: Pass the meeting booker its Google key
        if: steps.token.outputs.ok == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          if ! sa=$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | jq -ce 'select(.client_email and .private_key)' 2>/dev/null); then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON isn't a Google service account key file. Paste the whole .json file into the secret again."
            exit 1
          fi
          supabase secrets set GOOGLE_SERVICE_ACCOUNT_B64="$(printf '%s' "$sa" | base64 -w0)" --project-ref "$PROJECT_REF" > /dev/null
          echo "Google key set."
      # Booked meetings sync to our own GoHighLevel sub-account: a Private
      # Integration token and the location ID, as the GHL_PRECALL_TOKEN and
      # GHL_PRECALL_LOCATION_ID repo secrets.
      - name: Pass the meeting booker its GHL key
        if: steps.token.outputs.ok == 'true' && env.GHL_PRECALL_TOKEN != '' && env.GHL_PRECALL_LOCATION_ID != ''
        run: supabase secrets set GHL_PRECALL_TOKEN="$GHL_PRECALL_TOKEN" GHL_PRECALL_LOCATION_ID="$GHL_PRECALL_LOCATION_ID" --project-ref "$PROJECT_REF" > /dev/null
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          for fn in sync-client-ads ghl-report-data jarvis send-scheduled-emails sync-client-inbox sync-ghl-leads precall-meetings; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
      # Run this workflow by hand with a test_email to check sending works.
      - name: Send a test email
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.test_email != ''
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          to=$(printf '%s' "$TEST_EMAIL" | tr -d "'\\")
          q "insert into scheduled_emails (kind, to_email, subject, body, send_at, created_by) values ('test', '$to', 'Mr Priceless CRM - test email', 'Hey,' || chr(10) || chr(10) || 'This is a test from the Mr Priceless CRM. If you can read this, receipts will send themselves on the date you pick.' || chr(10) || chr(10) || 'Cheers,' || chr(10) || 'Mr Priceless', now(), 'workflow')" > /dev/null
          secret=$(q "select value from app_secrets where name = 'email_cron_secret'" | jq -r '.[0].value')
          echo "::add-mask::$secret"
          sleep 5
          curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/send-scheduled-emails" \
            -H "Content-Type: application/json" -H "Authorization: Bearer sb_publishable_2FnHNV8THv1QUrFumCzu4A_WyCD9UH_" \
            -H "x-cron-secret: $secret" --data '{}'
          echo
          q "select to_email, status, error, sent_at from scheduled_emails where kind = 'test' order by created_at desc limit 1"
      # Run this workflow by hand with create_login to give someone a CRM
      # login: they're added to the team list, their account is made (already
      # confirmed, with a throwaway password nobody sees), and Supabase emails
      # them a link to set their own password. No keys or passwords are printed.
      - name: Create a CRM login
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.create_login != ''
        env:
          NEW_LOGIN: ${{ inputs.create_login }}
        run: |
          email=$(printf '%s' "$NEW_LOGIN" | tr -d "'\\\" " | tr 'A-Z' 'a-z')
          case "$email" in *@*.*) ;; *) echo "::error::That isn't an email address."; exit 1;; esac
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          q "insert into allowlist (email, invited_by) values ('$email', 'workflow') on conflict (email) do nothing" > /dev/null
          echo "Added to the team list."
          key=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          echo "::add-mask::$key"
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          base="https://$PROJECT_REF.supabase.co"
          code=$(curl -sS -o /tmp/u.json -w '%{http_code}' -X POST "$base/auth/v1/admin/users" \
            -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" \
            --data "$(jq -n --arg e "$email" --arg p "$pw" '{email: $e, password: $p, email_confirm: true}')")
          if [ "$code" = "200" ]; then echo "Account created."; else echo "Account not created (HTTP $code): $(jq -r '.msg // .message // .error_description // "unknown"' /tmp/u.json) - if it already exists, the set-password email below still works."; fi
          # The link in the email can only send them back to an address Supabase allows.
          crm="https://rocky-toky.github.io/mr-priceless-crm/"
          cfg=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          allow=$(printf '%s' "$cfg" | jq -r '.uri_allow_list // ""')
          echo "Site URL: $(printf '%s' "$cfg" | jq -r '.site_url // ""')"
          echo "Allowed redirects: $allow"
          case ",$allow," in *",$crm,"*|*",${crm}**,"*) ;; *)
            new=$(printf '%s' "$allow" | jq -Rr --arg c "$crm" 'split(",") | map(select(length > 0)) + [$c, ($c + "**")] | unique | join(",")')
            curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg a "$new" '{uri_allow_list: $a}')" | jq '{uri_allow_list}'
            echo "Added the CRM to the allowed redirects." ;;
          esac
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "$base/auth/v1/recover?redirect_to=https%3A%2F%2Frocky-toky.github.io%2Fmr-priceless-crm%2F" \
            -H "apikey: $key" -H "Content-Type: application/json" --data "$(jq -n --arg e "$email" '{email: $e}')")
          if [ "$code" = "200" ]; then echo "Set-password email sent to $email."; else echo "::error::Couldn't send the set-password email (HTTP $code): $(jq -r '.msg // .message // .error_description // "unknown"' /tmp/r.json)"; exit 1; fi
      # Run by hand with check_lead_sync=yes: runs the lead sync now and
      # prints how it went. Counts and error text only - no client names or
      # lead details, since these logs are public.
      - name: Check the lead sync
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.check_lead_sync == 'yes'
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          echo "Clients:"
          q "select count(*) filter (where coalesce(c.stage,'') not in ('churned','archived')) as live_clients, count(g.client_id) filter (where coalesce(c.stage,'') not in ('churned','archived')) as live_connected_to_ghl, count(*) filter (where coalesce(c.stage,'') not in ('churned','archived') and g.client_id is null) as live_not_connected from clients c left join client_ghl g on g.client_id = c.id" | jq -c '.[0]'
          echo "Connected clients by stage:"
          q "select coalesce(c.stage,'none') as stage, count(*) from client_ghl g join clients c on c.id = g.client_id group by 1 order by 1" | jq -c '.[]'
          echo "Sync schedule (last 5 runs):"
          q "select status, left(coalesce(return_message,''),120) as message, start_time from cron.job_run_details where jobid = (select jobid from cron.job where jobname = 'sync-ghl-leads') order by start_time desc limit 5" | jq -c '.[]'
          secret=$(q "select value from app_secrets where name = 'leads_cron_secret'" | jq -r '.[0].value')
          echo "::add-mask::$secret"
          echo "Running the sync now:"
          curl -sS -m 160 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/sync-ghl-leads" \
            -H "Content-Type: application/json" -H "Authorization: Bearer sb_publishable_2FnHNV8THv1QUrFumCzu4A_WyCD9UH_" \
            -H "x-cron-secret: $secret" --data '{}' -w "  (HTTP %{http_code}, %{time_total}s)"
          echo
          echo "Sync status after the run:"
          q "select count(*) as rows, count(*) filter (where last_ok_at is not null and error is null) as working, count(*) filter (where error is not null) as with_error, count(*) filter (where contacts_access = false) as no_contacts_access, count(*) filter (where last_ok_at is null and error is null) as not_finished from lead_sync_status" | jq -c '.[0]'
          echo "Errors seen (text only):"
          q "select left(error, 160) as error, count(*) from lead_sync_status where error is not null group by 1" | jq -c '.[]'
          echo "Where lead details live in GHL (shape only, 2 recent leads per connected client):"
          curl -sS -m 160 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/sync-ghl-leads" \
            -H "Content-Type: application/json" -H "Authorization: Bearer sb_publishable_2FnHNV8THv1QUrFumCzu4A_WyCD9UH_" \
            -H "x-cron-secret: $secret" --data '{"action":"inspect"}' | jq -c '.[]'
          echo "Leads with details read:"
          q "select count(*) filter (where details_at is not null) as details_read, count(*) filter (where ghl_contact_id is not null) as with_contact_id, count(*) as total from client_leads where source = 'ghl' and coalesce(lead_created_at, created_at) > now() - interval '3 days'" | jq -c '.[0]'
          echo "Leads in the last 3 days by source:"
          q "select coalesce(source,'none') as source, count(*), count(*) filter (where jsonb_array_length(answers) > 0) as with_answers, count(*) filter (where coalesce(address,city) is not null) as with_location from client_leads where coalesce(lead_created_at, created_at) > now() - interval '3 days' group by 1" | jq -c '.[]'
      # Run by hand with check_calendar=someone@mrpriceless.com: asks Google
      # for a token as that person and looks at their calendar. Prints only
      # whether it worked (and how many upcoming events it could see, 0 or 1).
      - name: Check calendar access
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.check_calendar != ''
        env:
          CHECK_EMAIL: ${{ inputs.check_calendar }}
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          secret=$(q "select value from app_secrets where name = 'precall_cron_secret'" | jq -r '.[0].value')
          echo "::add-mask::$secret"
          sleep 5
          curl -sS -m 60 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/precall-meetings" \
            -H "Content-Type: application/json" -H "Authorization: Bearer sb_publishable_2FnHNV8THv1QUrFumCzu4A_WyCD9UH_" \
            -H "x-cron-secret: $secret" --data "$(jq -n --arg e "$CHECK_EMAIL" '{action: "check_calendar", email: $e}')"
          echo
      # Run by hand with check_meetings=yes. Statuses and counts only: no
      # names, and email addresses are shown only as "team" or "other".
      - name: Check booked meetings
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.check_meetings == 'yes'
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          echo "Live updates on for:"
          q "select tablename from pg_publication_tables where pubname = 'supabase_realtime' and tablename in ('meetings', 'meeting_events', 'precall_settings', 'deals')" | jq -c '[.[].tablename]'
          echo "Calendar check (last 5 runs):"
          q "select status, left(coalesce(return_message,''),120) as message, start_time from cron.job_run_details where jobid = (select jobid from cron.job where jobname = 'precall-watch') order by start_time desc limit 5" | jq -c '.[]'
          echo "Calendar check replies (last 5):"
          q "select status_code, left(coalesce(content::text, error_msg, ''), 160) as reply, created from net._http_response where coalesce(content::text,'') like '%checked%' or coalesce(error_msg,'') <> '' order by created desc limit 5" | jq -c '.[]' || true
          echo "Meetings:"
          q "select status, calendar_flag, prospect_response, case when setter_email like '%@mrpriceless.com' then 'team' when setter_email is null then 'none' else 'other' end as setter_email, (calendar_checked_at is not null) as checked from meetings order by created_at desc limit 10" | jq -c '.[]'
          echo "Alert emails:"
          q "select status, left(coalesce(error,''),160) as error, case when to_email like '%@mrpriceless.com' then 'team' else 'other' end as to_email, send_at, sent_at from scheduled_emails where kind = 'precall_alert' order by created_at desc limit 10" | jq -c '.[]'
          echo "Email sender (last 3 runs):"
          q "select status, left(coalesce(return_message,''),120) as message, start_time from cron.job_run_details where jobid = (select jobid from cron.job where jobname = 'send-scheduled-emails') order by start_time desc limit 3" | jq -c '.[]'
          echo "GHL sync:"
          q "select status, ghl_status, ghl_tag, left(coalesce(ghl_error,''),160) as ghl_error, ghl_attempts from meetings order by created_at desc limit 10" | jq -c '.[]'
      # Run by hand with setup_ghl=yes: makes the pre-call custom fields in
      # our GHL sub-account if they're missing, and lists the fields and tags.
      - name: Set up GHL fields
        if: steps.token.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.setup_ghl == 'yes'
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json; curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          secret=$(q "select value from app_secrets where name = 'precall_cron_secret'" | jq -r '.[0].value')
          echo "::add-mask::$secret"
          sleep 5
